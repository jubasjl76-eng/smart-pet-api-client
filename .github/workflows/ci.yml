name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    uses: jubasjl76-eng/smart-pet-ci/.github/workflows/node-ci.yml@main
    with:
      node-version: "22"
      test-command: "npm test"
      run-build: true

  schema-fresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - run: npm run codegen
      - name: schema.d.ts is up to date
        run: git diff --exit-code src/schema.d.ts || (echo "::error::src/schema.d.ts is stale — run 'npm run codegen'"; exit 1)
