name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    uses: jubasjl76-eng/smart-pet-ci/.github/workflows/node-ci.yml@main
    with:
      node-version: "22"
      test-command: "npm test"
      run-build: true

  schema-fresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with: { node-version: "22", cache: npm }
      - run: npm ci
      - run: npm run codegen
      - name: schema.d.ts is up to date
        run: git diff --exit-code src/schema.ts || (echo "::error::src/schema.ts is stale — run 'npm run codegen'"; exit 1)
